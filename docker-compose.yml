services:
  redis:
    image: redis:7-alpine
    container_name: neil_redis
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: neil_mongo
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: neil_duplantis
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data:
